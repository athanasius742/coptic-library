<p><b><span><font>احرص على وقتك</font></span></b><span><font><b> 
| من أقوال الأب دوروثيؤس:-</b></font></span></p>
<p><b><span>
<font>ليتنا نهتم بأنفسنا بعناية، لأنه من يعيد 
إلينا هذا الوقت إن أضعناه؟ حتمًا إنه سيأتي الوقت الذي فيه نطلب أن نجد هذه 
الأيام ولا نجدها. لقد اعتاد 
<a href="../../../Saints/Coptic-Orthodox-Saints-Biography/Coptic-Saints-Story_120.html">الأب أرسانيوس</a> أن يكرر قوله لنفسه: "يا 
<a href="../../../Saints/Coptic-Orthodox-Saints-Biography/Coptic-Saints-Story_120.html">أرسانيوس</a> 
أنظر لماذا تركت العالم؟!"</font></span></b></p>
